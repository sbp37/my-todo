<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F4EE" />
    <title>SUBIN WORKROOM v6 · Atelier</title>
    <style>
      :root {
        --bg: #f7f4ee;
        --paper: #fffefb;
        --paper2: #fbf8f2;
        --ink: #2e2924;
        --muted: #746e66;
        --line: #e5ded5;
        --blue: #5a7d8c;
        --blue2: #3d6574;
        --blueSoft: #e7f0f3;
        --red: #b45f56;
        --redSoft: #f8e9e6;
        --sage: #80947b;
        --sageSoft: #ebf1e9;
        --yellow: #c79a35;
        --yellowSoft: #fbf2d7;
        --purple: #88799a;
        --purpleSoft: #f0ecf5;
        --shadow: 0 8px 28px rgba(61, 52, 43, 0.065);
        --r: 20px;
        --r2: 15px;
      }
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        font-size: 17px;
        background: var(--bg);
        color-scheme: light;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Pretendard, "Apple SD Gothic Neo", "Noto Sans KR", system-ui,
          sans-serif;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible {
        outline: 3px solid rgba(90, 125, 140, 0.25);
        outline-offset: 2px;
      }
      .app {
        max-width: 1320px;
        min-height: 100vh;
        margin: 0 auto;
        background: var(--bg);
      }
      .topbar {
        position: sticky;
        top: 0;
        z-index: 40;
        background: rgba(247, 244, 238, 0.95);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--line);
        padding: 10px 16px 12px;
      }
      .toprow {
        display: grid;
        grid-template-columns: 48px minmax(0, 1fr) 48px;
        align-items: center;
        min-height: 50px;
      }
      .brand {
        text-align: center;
        min-width: 0;
      }
      .brand h1 {
        font:
          500 1.35rem/1 Georgia,
          "Times New Roman",
          serif;
        letter-spacing: 0.045em;
        margin: 0;
        white-space: nowrap;
      }
      .brand p {
        font-size: 0.72rem;
        letter-spacing: 0.14em;
        color: var(--muted);
        margin: 5px 0 0;
      }
      .iconbtn {
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 14px;
        background: transparent;
        font-size: 1.25rem;
      }
      .iconbtn:hover {
        background: var(--paper);
      }
      .workspace-switch {
        width: min(360px, 100%);
        margin: 9px auto 0;
        padding: 4px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--paper);
        box-shadow: 0 3px 12px rgba(60, 50, 40, 0.04);
      }
      .workspace-switch button {
        min-height: 42px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        font-weight: 800;
        color: var(--muted);
      }
      .workspace-switch button.on {
        background: var(--blue);
        color: white;
        box-shadow: 0 4px 12px rgba(90, 125, 140, 0.2);
      }
      main {
        padding: 22px 16px calc(105px + env(safe-area-inset-bottom));
      }
      .page {
        max-width: 1160px;
        margin: 0 auto;
      }
      .page-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 14px;
        margin: 0 0 18px;
      }
      .page-head h2 {
        font-size: 1.55rem;
        line-height: 1.22;
        margin: 0;
      }
      .page-head p {
        font-size: 0.98rem;
        color: var(--muted);
        margin: 6px 0 0;
      }
      .head-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .card {
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
      }
      .section {
        padding: 19px;
        margin-bottom: 14px;
      }
      .section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .section-head h3 {
        font-size: 1.1rem;
        margin: 0;
      }
      .section-head p {
        font-size: 0.88rem;
        color: var(--muted);
        margin: 2px 0 0;
      }
      .subtle {
        color: var(--muted);
        font-size: 0.88rem;
      }
      .btn {
        min-height: 46px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper);
        padding: 10px 15px;
        font-weight: 800;
        font-size: 0.94rem;
      }
      .btn:hover {
        filter: brightness(0.985);
      }
      .btn.primary {
        background: var(--blue);
        border-color: var(--blue);
        color: white;
      }
      .btn.soft {
        background: var(--blueSoft);
        border-color: transparent;
        color: var(--blue2);
      }
      .btn.red {
        background: var(--red);
        border-color: var(--red);
        color: white;
      }
      .btn.text {
        border: 0;
        background: transparent;
        min-height: auto;
        padding: 5px;
        color: var(--blue2);
      }
      .btn.small {
        min-height: 38px;
        padding: 7px 11px;
        font-size: 0.85rem;
      }
      .btn.block {
        width: 100%;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .mini {
        width: 40px;
        height: 40px;
        border: 0;
        border-radius: 12px;
        background: transparent;
        font-size: 1.15rem;
      }
      .mini:hover {
        background: var(--paper2);
      }
      .input,
      .select,
      .textarea {
        width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        background: white;
        border-radius: 14px;
        padding: 12px 13px;
        font-size: 1rem;
      }
      .textarea {
        min-height: 105px;
        resize: vertical;
      }
      .field label {
        display: block;
        font-weight: 800;
        font-size: 0.9rem;
        margin-bottom: 6px;
      }
      .helper {
        font-size: 0.82rem;
        color: var(--muted);
        margin-top: 5px;
      }
      .form-grid {
        display: grid;
        gap: 13px;
      }
      .form-2,
      .form-3 {
        display: grid;
        gap: 12px;
      }
      .form-2 {
        grid-template-columns: 1fr 1fr;
      }
      .form-3 {
        grid-template-columns: repeat(3, 1fr);
      }
      .pill,
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        padding: 5px 9px;
        font-size: 0.78rem;
        font-weight: 750;
        background: var(--blueSoft);
        color: var(--blue2);
      }
      .pill.red,
      .badge.red {
        background: var(--redSoft);
        color: #8c4942;
      }
      .pill.sage,
      .badge.sage {
        background: var(--sageSoft);
        color: #587052;
      }
      .pill.yellow,
      .badge.yellow {
        background: var(--yellowSoft);
        color: #87661c;
      }
      .pill.purple,
      .badge.purple {
        background: var(--purpleSoft);
        color: #665774;
      }
      .pill.gray,
      .badge.gray {
        background: #f0ece6;
        color: #6f675e;
      }
      .pill.dark {
        background: #3a3530;
        color: #fff;
      }
      .track {
        height: 12px;
        background: #ece5dc;
        border-radius: 999px;
        overflow: hidden;
      }
      .fill {
        height: 100%;
        background: var(--blue);
        border-radius: 999px;
        transition: width 0.25s;
      }
      .fill.sage {
        background: var(--sage);
      }
      .fill.yellow {
        background: var(--yellow);
      }
      .fill.red {
        background: var(--red);
      }
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .metric {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--paper2);
      }
      .metric b {
        display: block;
        font-size: 1.22rem;
      }
      .metric span {
        font-size: 0.82rem;
        color: var(--muted);
      }
      .hero-layout {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(300px, 0.8fr);
        gap: 14px;
        margin-bottom: 14px;
      }
      .priority-card {
        padding: 20px;
      }
      .eyebrow {
        font-size: 0.83rem;
        color: var(--muted);
        font-weight: 800;
      }
      .priority-card h2 {
        font-size: 1.48rem;
        line-height: 1.35;
        margin: 8px 0;
      }
      .priority-meta {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 10px 0 16px;
      }
      .next-box {
        padding: 13px 14px;
        border-radius: 14px;
        background: var(--paper2);
        border: 1px solid var(--line);
        margin: 13px 0;
      }
      .next-box b {
        display: block;
        font-size: 0.83rem;
        color: var(--muted);
        margin-bottom: 3px;
      }
      .reason {
        font-size: 0.9rem;
        color: var(--muted);
        margin-top: 8px;
      }
      .priority-actions {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 9px;
        margin-top: 16px;
      }
      .dashboard-side {
        display: grid;
        gap: 14px;
      }
      .progress-card {
        padding: 17px;
      }
      .progress-line {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 9px;
      }
      .progress-line b {
        font-size: 1.02rem;
      }
      .progress-line span {
        font-size: 0.88rem;
        color: var(--muted);
      }
      .progress-stack {
        display: grid;
        gap: 14px;
      }
      .two-col {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .three-col {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .timeline {
        display: grid;
      }
      .event-row {
        display: grid;
        grid-template-columns: 68px minmax(0, 1fr) auto;
        gap: 11px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .event-row:last-child {
        border-bottom: 0;
      }
      .event-time {
        font-weight: 850;
        color: #9a633f;
      }
      .event-title {
        font-weight: 800;
      }
      .event-note {
        font-size: 0.84rem;
        color: var(--muted);
        margin-top: 2px;
      }
      .alert-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
      .alert-card {
        padding: 13px;
        border-radius: 15px;
        border: 1px solid var(--line);
        background: white;
      }
      .alert-card.red {
        background: #fff7f5;
        border-color: #eed8d3;
      }
      .alert-card.yellow {
        background: #fffbf0;
        border-color: #ebddad;
      }
      .alert-card.blue {
        background: #f3f8fa;
        border-color: #d7e5ea;
      }
      .alert-card b {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.91rem;
      }
      .alert-card p {
        font-size: 0.82rem;
        color: var(--muted);
        margin: 5px 0 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .task-list {
        display: grid;
        gap: 8px;
      }
      .task-row {
        display: grid;
        grid-template-columns: 29px minmax(0, 1fr) auto;
        gap: 11px;
        align-items: start;
        padding: 13px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: white;
      }
      .task-check {
        width: 23px;
        height: 23px;
        margin: 2px 0 0;
        accent-color: var(--blue);
      }
      .task-title {
        font-weight: 800;
        line-height: 1.4;
      }
      .task-title.done {
        text-decoration: line-through;
        color: var(--muted);
      }
      .task-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .task-note {
        font-size: 0.84rem;
        color: var(--muted);
        margin-top: 5px;
      }
      .task-actions {
        display: flex;
        gap: 2px;
      }
      .quick-add {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 9px;
      }
      .season-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }
      .tab-row,
      .filter-row {
        display: flex;
        gap: 8px;
        overflow: auto;
        padding-bottom: 2px;
      }
      .chip {
        border: 1px solid var(--line);
        background: white;
        border-radius: 999px;
        padding: 9px 14px;
        white-space: nowrap;
        font-size: 0.88rem;
        font-weight: 750;
      }
      .chip.on {
        background: var(--blue);
        color: white;
        border-color: var(--blue);
      }
      .season-summary {
        padding: 18px;
        margin-bottom: 14px;
      }
      .season-titleline {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .season-titleline h3 {
        font-size: 1.35rem;
        margin: 0;
      }
      .season-titleline p {
        font-size: 0.9rem;
        color: var(--muted);
        margin: 4px 0 0;
      }
      .season-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 9px;
        margin-top: 16px;
      }
      .season-stat {
        padding: 11px;
        border-radius: 14px;
        background: var(--paper2);
        border: 1px solid var(--line);
      }
      .season-stat b {
        display: block;
        font-size: 1.05rem;
      }
      .season-stat span {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .p-group {
        margin-bottom: 15px;
        overflow: hidden;
      }
      .p-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--line);
        background: #fbf8f1;
      }
      .p-head h3 {
        font-size: 1.13rem;
        margin: 0;
      }
      .p-head p {
        font-size: 0.83rem;
        color: var(--muted);
        margin: 2px 0 0;
      }
      .p-progress {
        min-width: 180px;
        text-align: right;
      }
      .p-progress b {
        font-size: 0.88rem;
      }
      .p-progress .track {
        margin-top: 7px;
      }
      .concept-pair {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 14px;
      }
      .concept-card {
        border: 1px solid var(--line);
        border-radius: 17px;
        background: white;
        padding: 16px;
        min-width: 0;
        cursor: pointer;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .concept-card:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 24px rgba(50, 44, 38, 0.07);
      }
      .concept-top {
        display: flex;
        justify-content: space-between;
        gap: 9px;
        align-items: flex-start;
      }
      .concept-line {
        font-size: 0.82rem;
        font-weight: 900;
        letter-spacing: 0.04em;
      }
      .concept-card h4 {
        font-size: 1.12rem;
        line-height: 1.35;
        margin: 7px 0 4px;
      }
      .concept-direction {
        font-size: 0.88rem;
        color: var(--muted);
        line-height: 1.55;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .keyword-row,
      .color-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .color-dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid white;
        box-shadow: 0 0 0 1px var(--line);
      }
      .concept-progress {
        margin-top: 13px;
      }
      .concept-progress-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.84rem;
      }
      .concept-progress-top b {
        font-weight: 850;
      }
      .concept-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
        font-size: 0.82rem;
      }
      .empty-concept {
        display: grid;
        place-items: center;
        text-align: center;
        min-height: 230px;
        border-style: dashed;
        color: var(--muted);
      }
      .compare-strip {
        padding: 11px 16px 14px;
        border-top: 1px solid var(--line);
        font-size: 0.82rem;
        color: var(--muted);
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .compare-strip b {
        color: var(--ink);
      }
      .owner-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 9px;
      }
      .owner-card {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: var(--paper2);
      }
      .owner-card b {
        font-size: 1.1rem;
      }
      .owner-card span {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
      }
      .canvas-summary {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--paper2);
        margin-bottom: 14px;
      }
      .canvas-summary h4 {
        font-size: 1.15rem;
        margin: 3px 0;
      }
      .canvas-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .canvas-block {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: white;
        padding: 14px;
      }
      .canvas-block h4 {
        font-size: 1rem;
        margin: 0 0 10px;
      }
      .canvas-list {
        display: grid;
        gap: 8px;
      }
      .canvas-item b {
        display: block;
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 2px;
      }
      .canvas-item p {
        margin: 0;
        font-size: 0.92rem;
        white-space: pre-wrap;
      }
      .missing-list {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
      }
      .counter {
        display: grid;
        grid-template-columns: auto 1fr auto auto;
        gap: 8px;
        align-items: center;
      }
      .counter-value {
        text-align: center;
        font-size: 1.18rem;
        font-weight: 900;
        padding: 7px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--paper2);
      }
      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .gallery-item {
        position: relative;
        aspect-ratio: 1;
        background: #eee8df;
        border: 1px solid var(--line);
        border-radius: 13px;
        overflow: hidden;
      }
      .gallery-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .gallery-item button {
        position: absolute;
        right: 5px;
        top: 5px;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 9px;
        background: rgba(255, 255, 255, 0.9);
      }
      .cal-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 13px;
      }
      .cal-title {
        font-size: 1.2rem;
        font-weight: 900;
      }
      .view-switch {
        display: flex;
        padding: 3px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: white;
      }
      .view-switch button {
        border: 0;
        background: transparent;
        border-radius: 9px;
        padding: 7px 11px;
        font-size: 0.82rem;
        font-weight: 800;
      }
      .view-switch button.on {
        background: var(--blueSoft);
        color: var(--blue2);
      }
      .cal-grid {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 6px;
      }
      .dow {
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
        padding: 6px;
      }
      .day {
        min-height: 128px;
        padding: 8px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: white;
        overflow: hidden;
      }
      .day.other {
        opacity: 0.42;
      }
      .day.today {
        border: 2px solid var(--blue);
      }
      .day.selected {
        background: #f1f7f8;
      }
      .day-num {
        font-weight: 900;
        margin-bottom: 7px;
      }
      .cal-entry {
        font-size: 0.75rem;
        line-height: 1.25;
        padding: 4px 5px;
        border-radius: 7px;
        background: var(--blueSoft);
        color: #365e6b;
        margin-bottom: 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cal-entry.event {
        background: var(--yellowSoft);
        color: #7d601c;
      }
      .cal-entry.trip {
        background: var(--redSoft);
        color: #864b43;
      }
      .cal-entry.personal {
        background: var(--sageSoft);
        color: #577052;
      }
      .more {
        font-size: 0.72rem;
        color: var(--muted);
        font-weight: 750;
      }
      .week-list {
        display: grid;
        gap: 9px;
      }
      .week-day {
        border: 1px solid var(--line);
        border-radius: 16px;
        background: white;
        padding: 13px;
      }
      .week-day.today {
        border: 2px solid var(--blue);
      }
      .week-date {
        font-weight: 900;
        margin-bottom: 8px;
      }
      .week-entry {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr);
        gap: 9px;
        padding: 8px 0;
        border-top: 1px solid var(--line);
      }
      .week-entry:first-of-type {
        border-top: 0;
      }
      .week-time {
        font-size: 0.83rem;
        color: #91613f;
        font-weight: 800;
      }
      .week-title {
        font-size: 0.91rem;
        font-weight: 800;
      }
      .trend-tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        border: 1px solid var(--line);
        border-radius: 15px;
        overflow: hidden;
        background: white;
        margin-bottom: 14px;
      }
      .trend-tabs button {
        border: 0;
        border-right: 1px solid var(--line);
        background: white;
        min-height: 48px;
        font-weight: 800;
        font-size: 0.87rem;
      }
      .trend-tabs button:last-child {
        border-right: 0;
      }
      .trend-tabs button.on {
        background: var(--blue);
        color: white;
      }
      .brand-grid,
      .search-grid,
      .project-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
      }
      .brand-card,
      .search-card,
      .project-card {
        padding: 15px;
      }
      .brand-card h4,
      .search-card h4,
      .project-card h4 {
        font-size: 1.02rem;
        margin: 0;
      }
      .brand-card p,
      .search-card p,
      .project-card p {
        font-size: 0.85rem;
        color: var(--muted);
        margin: 6px 0 0;
      }
      .brand-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      .ref-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 9px;
      }
      .ref-card {
        overflow: hidden;
      }
      .ref-img {
        aspect-ratio: 1;
        background: #eee8df;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .ref-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ref-body {
        padding: 10px;
      }
      .ref-body h5 {
        font-size: 0.9rem;
        margin: 0;
      }
      .ref-body p {
        font-size: 0.8rem;
        color: var(--muted);
        margin: 4px 0 0;
      }
      .idea-row {
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: white;
        margin-bottom: 9px;
      }
      .idea-row h4 {
        font-size: 0.98rem;
        margin: 0;
      }
      .idea-row p {
        font-size: 0.84rem;
        color: var(--muted);
        margin: 5px 0 0;
      }
      .idea-media {
        width: 84px;
        height: 84px;
        border-radius: 12px;
        object-fit: cover;
        float: right;
        margin-left: 10px;
      }
      .brief {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 15px;
        background: white;
        margin-bottom: 9px;
      }
      .brief h4 {
        font-size: 1rem;
        margin: 0;
      }
      .brief .date {
        font-size: 0.8rem;
        color: var(--muted);
      }
      .brief ul {
        font-size: 0.91rem;
        line-height: 1.6;
        margin: 9px 0 0;
        padding-left: 20px;
      }
      .trip-banner {
        padding: 18px;
        background: linear-gradient(135deg, #edf4f5, #fcf8ef);
        border: 1px solid #d8e4e7;
        border-radius: 20px;
        margin-bottom: 14px;
      }
      .trip-banner h3 {
        font-size: 1.3rem;
        margin: 3px 0;
      }
      .trip-info-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 14px;
      }
      .info-box {
        padding: 11px;
        border-radius: 13px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(220, 224, 220, 0.9);
      }
      .info-box b {
        display: block;
        font-size: 0.79rem;
        color: var(--muted);
      }
      .info-box span {
        font-size: 0.9rem;
      }
      .stage-row {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .stage-row:last-child {
        border-bottom: 0;
      }
      .stage-no {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--blueSoft);
        display: grid;
        place-items: center;
        color: var(--blue2);
        font-size: 0.82rem;
        font-weight: 900;
      }
      .stage-title {
        font-weight: 850;
      }
      .stage-count {
        font-size: 0.82rem;
        color: var(--muted);
      }
      .check-row {
        display: grid;
        grid-template-columns: 27px minmax(0, 1fr) auto;
        gap: 9px;
        padding: 10px 0;
        border-bottom: 1px dashed var(--line);
      }
      .check-row input {
        width: 22px;
        height: 22px;
        accent-color: var(--sage);
      }
      .empty {
        text-align: center;
        padding: 30px 16px;
        color: var(--muted);
      }
      .empty b {
        display: block;
        color: var(--ink);
        font-size: 1rem;
        margin-bottom: 4px;
      }
      .hidden {
        display: none !important;
      }
      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 45;
        background: rgba(255, 254, 251, 0.97);
        backdrop-filter: blur(16px);
        border-top: 1px solid var(--line);
        padding: 7px max(8px, env(safe-area-inset-left))
          calc(7px + env(safe-area-inset-bottom))
          max(8px, env(safe-area-inset-right));
      }
      .nav-inner {
        max-width: 780px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 3px;
      }
      .nav button {
        border: 0;
        background: transparent;
        border-radius: 13px;
        min-height: 59px;
        font-size: 0.7rem;
        font-weight: 800;
        color: var(--muted);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 3px;
      }
      .nav button span {
        font-size: 1.15rem;
        line-height: 1;
      }
      .nav button.on {
        background: var(--blueSoft);
        color: var(--blue2);
      }
      .fab {
        position: fixed;
        right: 20px;
        bottom: 88px;
        z-index: 30;
        width: 60px;
        height: 60px;
        border: 0;
        border-radius: 50%;
        background: var(--blue);
        color: white;
        font-size: 1.75rem;
        box-shadow: 0 12px 28px rgba(90, 125, 140, 0.3);
      }
      .modal {
        position: fixed;
        inset: 0;
        z-index: 70;
        background: rgba(39, 34, 30, 0.46);
        display: none;
        align-items: flex-end;
        justify-content: center;
      }
      .modal.on {
        display: flex;
      }
      .sheet {
        width: 100%;
        max-width: 820px;
        max-height: 93vh;
        overflow: auto;
        background: var(--bg);
        border-radius: 24px 24px 0 0;
        padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
        box-shadow: 0 -14px 45px rgba(0, 0, 0, 0.13);
      }
      .sheet.wide {
        max-width: 1060px;
      }
      .sheet-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
        position: sticky;
        top: -18px;
        background: var(--bg);
        padding: 12px 0 10px;
        z-index: 4;
      }
      .sheet-head h3 {
        font-size: 1.28rem;
        margin: 0;
      }
      .close {
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 13px;
        background: var(--paper);
        font-size: 1.3rem;
      }
      .details {
        border-top: 1px solid var(--line);
        padding-top: 4px;
      }
      .details summary {
        font-weight: 850;
        padding: 12px 0;
        cursor: pointer;
      }
      .danger-zone {
        border-top: 1px solid var(--line);
        margin-top: 20px;
        padding-top: 15px;
      }
      .sticky-actions {
        position: sticky;
        bottom: -24px;
        background: linear-gradient(transparent, var(--bg) 20%);
        padding: 28px 0 0;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 9px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 105px;
        z-index: 90;
        transform: translate(-50%, 20px);
        opacity: 0;
        background: #342f2b;
        color: white;
        padding: 11px 16px;
        border-radius: 999px;
        font-size: 0.88rem;
        pointer-events: none;
        transition: 0.2s;
        max-width: 88vw;
        text-align: center;
      }
      .toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      .menu {
        position: fixed;
        right: 16px;
        top: 64px;
        z-index: 65;
        width: 230px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 14px 40px rgba(40, 34, 29, 0.14);
        padding: 7px;
        display: none;
      }
      .menu.on {
        display: block;
      }
      .menu button {
        width: 100%;
        border: 0;
        background: transparent;
        border-radius: 11px;
        padding: 11px;
        text-align: left;
        font-size: 0.9rem;
      }
      .menu button:hover {
        background: var(--paper2);
      }
      @media (max-width: 820px) {
        html {
          font-size: 17px;
        }
        .brand h1 {
          font-size: 1.25rem;
        }
        .brand p {
          font-size: 0.67rem;
        }
        .hero-layout,
        .two-col,
        .three-col {
          grid-template-columns: 1fr;
        }
        .dashboard-side {
          grid-template-columns: 1fr;
        }
        .metric-grid {
          grid-template-columns: 1fr 1fr;
        }
        .alert-grid {
          grid-template-columns: 1fr;
        }
        .concept-pair {
          grid-template-columns: 1fr;
        }
        .p-progress {
          min-width: 120px;
        }
        .season-stats {
          grid-template-columns: 1fr 1fr;
        }
        .owner-grid {
          grid-template-columns: 1fr 1fr;
        }
        .canvas-grid {
          grid-template-columns: 1fr;
        }
        .brand-grid,
        .search-grid,
        .project-grid {
          grid-template-columns: 1fr 1fr;
        }
        .ref-grid {
          grid-template-columns: repeat(2, 1fr);
        }
        .trip-info-grid {
          grid-template-columns: 1fr;
        }
        .form-3 {
          grid-template-columns: 1fr;
        }
        .cal-grid.month-grid {
          display: none;
        }
        .mobile-month .cal-grid.month-grid {
          display: grid;
        }
        .mobile-month .week-list {
          display: none;
        }
        .day {
          min-height: 100px;
          padding: 5px;
        }
        .cal-entry {
          font-size: 0.65rem;
        }
        .page-head {
          align-items: center;
        }
        .page-head h2 {
          font-size: 1.42rem;
        }
        .page-head p {
          font-size: 0.91rem;
        }
        .head-actions .btn:not(.primary) {
          display: none;
        }
        .priority-card h2 {
          font-size: 1.33rem;
        }
        .trend-tabs button {
          font-size: 0.78rem;
          padding: 0 3px;
        }
        .nav button {
          font-size: 0.66rem;
        }
        .workspace-switch {
          max-width: 310px;
        }
      }
      @media (max-width: 480px) {
        main {
          padding-left: 12px;
          padding-right: 12px;
        }
        .topbar {
          padding-left: 12px;
          padding-right: 12px;
        }
        .toprow {
          grid-template-columns: 44px 1fr 44px;
        }
        .brand h1 {
          font-size: 1.08rem;
          letter-spacing: 0.025em;
        }
        .brand p {
          font-size: 0.6rem;
          letter-spacing: 0.09em;
        }
        .section,
        .priority-card {
          padding: 16px;
        }
        .metric-grid {
          grid-template-columns: 1fr 1fr;
        }
        .brand-grid,
        .search-grid,
        .project-grid {
          grid-template-columns: 1fr;
        }
        .p-head {
          align-items: flex-start;
        }
        .p-progress {
          min-width: 105px;
        }
        .concept-card {
          padding: 14px;
        }
        .priority-actions {
          grid-template-columns: 1fr;
        }
        .priority-actions .btn:last-child {
          width: 100%;
        }
        .form-2 {
          grid-template-columns: 1fr;
        }
        .counter {
          grid-template-columns: auto 1fr auto;
        }
        .counter .btn:last-child {
          grid-column: 1/-1;
        }
        .gallery {
          grid-template-columns: repeat(2, 1fr);
        }
        .trend-tabs {
          grid-template-columns: 1fr 1fr;
        }
        .trend-tabs button:nth-child(2) {
          border-right: 0;
        }
        .trend-tabs button:nth-child(-n + 2) {
          border-bottom: 1px solid var(--line);
        }
        .nav button span {
          font-size: 1.05rem;
        }
        .nav button {
          font-size: 0.61rem;
        }
        .season-titleline {
          display: block;
        }
        .season-titleline .btn {
          margin-top: 10px;
        }
        .ref-grid {
          grid-template-columns: 1fr 1fr;
        }
        .p-head h3 {
          font-size: 1.04rem;
        }
      }
      @media (min-width: 821px) {
        html {
          font-size: 18px;
        }
        .sheet {
          border-radius: 24px;
          align-self: center;
        }
        .modal {
          align-items: center;
          padding: 24px;
        }
        .nav-inner {
          max-width: 900px;
        }
        .day {
          min-height: 145px;
        }
      }

      /* ===== v5 ATELIER RESPONSIVE DESIGN ===== */
      :root {
        --r: 17px;
        --r2: 13px;
        --shadow: 0 5px 18px rgba(61, 52, 43, 0.055);
      }
      html {
        font-size: 16px;
      }
      body {
        line-height: 1.48;
      }
      .topbar {
        padding: 7px 18px 9px;
      }
      .toprow {
        min-height: 43px;
      }
      .brand h1 {
        font-size: 1.28rem;
      }
      .brand p {
        font-size: 0.64rem;
        margin-top: 4px;
      }
      .iconbtn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
      }
      .workspace-switch {
        width: min(330px, 100%);
        margin-top: 6px;
        padding: 3px;
      }
      .workspace-switch button {
        min-height: 38px;
        font-size: 0.95rem;
      }
      main {
        padding: 18px 18px calc(92px + env(safe-area-inset-bottom));
      }
      .page {
        max-width: 1180px;
      }
      .page-head {
        margin-bottom: 14px;
      }
      .page-head h2 {
        font-size: 1.48rem;
      }
      .page-head p {
        font-size: 0.9rem;
        max-width: 620px;
      }
      .compact-head {
        align-items: center;
      }
      .compact-action {
        min-width: max-content;
        white-space: nowrap;
      }
      .card {
        border-radius: var(--r);
      }
      .section {
        padding: 16px;
        margin-bottom: 12px;
      }
      .section-head {
        margin-bottom: 11px;
      }
      .section-head h3 {
        font-size: 1.02rem;
      }
      .section-head p,
      .subtle {
        font-size: 0.82rem;
      }
      .btn {
        min-height: 40px;
        padding: 8px 13px;
        border-radius: 12px;
        font-size: 0.88rem;
        white-space: nowrap;
      }
      .btn.small {
        min-height: 34px;
        padding: 6px 10px;
        font-size: 0.8rem;
      }
      .btn.text {
        padding: 4px;
        font-size: 0.84rem;
      }
      .mini {
        width: 36px;
        height: 36px;
      }
      .input,
      .select,
      .textarea {
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 1rem;
      }
      .textarea {
        min-height: 88px;
      }
      .field label {
        font-size: 0.85rem;
      }
      .pill,
      .badge {
        padding: 4px 8px;
        font-size: 0.72rem;
      }
      .track {
        height: 9px;
      }
      .metric {
        padding: 11px;
        border-radius: 13px;
      }
      .metric b {
        font-size: 1.05rem;
      }
      .today-top {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.75fr);
        gap: 12px;
        margin-bottom: 12px;
      }
      .focus-card {
        min-height: 0;
      }
      .priority-card {
        padding: 18px;
      }
      .priority-heading {
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }
      .priority-card h2 {
        font-size: 1.32rem;
        margin: 6px 0;
      }
      .compact-next {
        padding: 11px 12px;
        margin: 10px 0;
      }
      .priority-actions {
        margin-top: 12px;
      }
      .today-rail {
        display: grid;
        gap: 12px;
      }
      .progress-compact {
        padding: 15px;
      }
      .progress-duo {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .progress-line {
        margin-bottom: 6px;
      }
      .season-progress-line {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-top: 1px solid var(--line);
        margin-top: 13px;
        padding-top: 11px;
      }
      .season-progress-line div {
        display: grid;
      }
      .season-progress-line span {
        font-size: 0.78rem;
        color: var(--muted);
      }
      .season-progress-line strong {
        font-size: 1.1rem;
      }
      .quick-card {
        padding: 14px;
      }
      .quick-card .section-head {
        margin-bottom: 8px;
      }
      .today-middle,
      .today-lower {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 12px;
      }
      .compact-section {
        margin-bottom: 0;
      }
      .event-row {
        grid-template-columns: 60px minmax(0, 1fr) auto;
        padding: 9px 0;
      }
      .alert-grid {
        gap: 8px;
      }
      .alert-card {
        padding: 11px;
      }
      .compact-empty {
        padding: 18px 12px;
      }
      .compact-empty b {
        font-size: 0.94rem;
      }
      .season-pulse {
        padding: 16px;
        margin-bottom: 12px;
      }
      .season-mini-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .season-stat {
        padding: 11px;
      }
      .season-stat > div {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .season-stat strong {
        font-size: 1rem;
      }
      .season-stat small {
        display: block;
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 5px;
      }
      .season-stat.coral {
        background: #fbf0ed;
      }
      .season-stat.mint {
        background: #edf5f1;
      }
      .season-stat.lavender {
        background: #f2eff7;
      }
      .season-stat.butter {
        background: #fbf5e5;
      }
      .season-stat .track {
        margin-top: 8px;
      }
      .support-stack {
        display: grid;
        gap: 12px;
      }
      .mini-support {
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .mini-support b {
        font-size: 0.96rem;
      }
      .mini-support p {
        font-size: 0.82rem;
        color: var(--muted);
        margin: 3px 0 0;
      }
      .briefing-mini p {
        max-width: 420px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .task-row {
        padding: 11px;
        border-radius: 13px;
      }
      .task-title {
        font-size: 0.93rem;
      }
      .task-note {
        font-size: 0.78rem;
      }
      .season-toolbar {
        margin-bottom: 11px;
      }
      .chip {
        padding: 7px 12px;

      /* ===== v6 LAYER ================================================= */
      /* 정보 위계: 페이지 제목 24px대, 카드 제목 17px대, 본문 15~16, 보조 13~14 */
      .page-head h2 { font-size: 1.5rem; }
      .section-head h3 { font-size: 1.05rem; }
      /* 모바일에서도 보조 버튼 숨기지 않기 (v5의 display:none 제거) */
      .head-actions .btn { display: inline-flex !important; align-items: center; justify-content: center; }
      .p-progress .btn { display: inline-flex !important; }
      /* 알림 3칸: 글자 세로 줄바꿈 방지 (컬럼 균등 분배) */
      .alert-grid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
      .alert-card b { white-space: nowrap; }
      /* 달력 툴바: 주간/월간 버튼과 제목 줄바꿈 방지 */
      .view-switch { flex: none; }
      .view-switch button { white-space: nowrap; }
      .cal-toolbar { flex-wrap: wrap; }
      .cal-toolbar > div:first-child { display: flex; align-items: center; gap: 2px; white-space: nowrap; }
      .cal-title { font-size: 1.08rem; }
      /* 좁은 화면 월간 셀: 시간은 숨기고 제목만 */
      @media (max-width: 640px) {
        .cal-entry .cal-time { display: none; }
        .day { padding: 4px 3px; min-height: 92px; }
        .day-num { font-size: 0.82rem; margin-bottom: 4px; }
        .cal-entry { font-size: 0.62rem; padding: 2px 3px; border-radius: 5px; margin-bottom: 3px; }
      }
      /* 달력: 주간/월간을 JS 클래스 하나로만 제어 (이중 표시 버그 수정) */
      .cal-wrap.view-week .month-grid { display: none !important; }
      .cal-wrap.view-week .week-list { display: grid !important; }
      .cal-wrap.view-month .month-grid { display: grid !important; }
      .cal-wrap.view-month .week-list { display: none !important; }
      .cal-scope { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
      .cal-entry { font-size: 0.74rem; padding: 3px 5px; }
      .day { min-height: 118px; }
      /* 페이스 상태 (텍스트+색) */
      .pace-line { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; font-size: 0.78rem; color: var(--muted); }
      .pill.blue { background: var(--blueSoft); color: var(--blue2); }
      /* 컨셉 핵심 체크리스트 */
      .keytask-row { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px dashed var(--line); }
      .keytask-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--sage); }
      .keytask-row .done { text-decoration: line-through; color: var(--muted); }
      /* 대표 이미지 지정 */
      .gallery-item .cover-btn { position: absolute; left: 5px; top: 5px; width: 30px; height: 30px; border: 0; border-radius: 9px; background: rgba(255, 255, 255, 0.88); font-size: 0.9rem; }
      .gallery-item.is-cover { outline: 3px solid var(--yellow); outline-offset: -3px; }
      /* 메모 */
      .memo-row { padding: 13px; border: 1px solid var(--line); border-radius: 14px; background: white; margin-bottom: 8px; }
      .memo-row .date { font-size: 0.74rem; color: var(--muted); }
      .memo-row p { margin: 5px 0 0; font-size: 0.93rem; white-space: pre-wrap; }
      .memo-row .btn { margin-top: 7px; }
      /* 개인 프로젝트 카드 메타 */
      .project-meta { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
      /* 브리핑 미니 3줄 */
      .briefing-mini ul { margin: 6px 0 0; padding-left: 16px; font-size: 0.8rem; color: var(--muted); line-height: 1.5; }
      .briefing-mini ul li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 460px; }
      /* 첫 작업 카드 액션 3버튼 */
      .priority-actions { grid-template-columns: 1fr auto auto; }
      /* 출장 정보: 모바일에서 2열로 압축 */

      function calendarTasks() {

      function tripEntriesFor(iso) {
        if (
          state.settings.workspace !== "work" &&
          state.settings.calendarScope !== "all"
        )
          return [];
        const out = [];
        state.trips.forEach((tr) => {
          if (!tr.startDate) return;
          const inRange = tr.endDate
            ? iso >= tr.startDate && iso <= tr.endDate
            : iso === tr.startDate;
          if (inRange)
            out.push({
              kind: "trip",
              cls: "trip",
              time: "",
              title:
                (iso === tr.startDate
                  ? "✈ 출발 · "
                  : iso === tr.endDate
                    ? "✈ 귀국 · "
                    : "✈ ") + tr.name,
              tripId: tr.id,
            });
        });
        return out;
      }
      function entriesFor(iso, tasks) {
        const es = tasks
          .filter((x) => x.date === iso)

            kind: x.kind,
            task: x,
            title: x.title,
            time: x.time || "",
            cls:
              x.kind === "event"
                ? "event"
                : x.category === "trip"
                  ? "trip"
                  : x.workspace === "personal" || x.category === "personal"
                    ? "personal"
                    : "",
          }));
        return [...tripEntriesFor(iso), ...es];
      }

      function monthCells(ym, tasks) {

          daysInMonth = new Date(year, month, 0).getDate(),
          cellCount = monIndex + daysInMonth <= 35 ? 35 : 42,
          maxEntries = window.innerWidth <= 640 ? 2 : window.innerWidth < 1024 ? 2 : 3;

      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const fr = new FileReader(),
            img = new Image();
          fr.onerror = reject;
          fr.onload = () => (img.src = fr.result);
          img.onerror = reject;
          img.onload = () => {
            const max = 1280,
              scale = Math.min(1, max / Math.max(img.width, img.height)),
              c = document.createElement("canvas");
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL("image/jpeg", 0.76));
          };
          fr.readAsDataURL(file);
        });
      }

          }
        };
        fr.readAsText(f);
      };
      document.addEventListener("click", (e) => {
        if (e.target.matches("[data-go-trip]")) {
          state.settings.tab = "trip";
          save();
          render();
        }
      });

      let calendarViewportBucket = window.innerWidth <= 640 ? "cover" : window.innerWidth < 1024 ? "fold" : "desktop";
      let calendarResizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(calendarResizeTimer);
        calendarResizeTimer = setTimeout(() => {
          const nextBucket = window.innerWidth <= 640 ? "cover" : window.innerWidth < 1024 ? "fold" : "desktop";
          if (nextBucket !== calendarViewportBucket) {
            calendarViewportBucket = nextBucket;
            if (state.settings.tab === "calendar") render();
          }
        }, 180);
      });
      render();
    </script>
  </body>
</html>
