<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14152b"><title>SUBIN CELLS</title><link rel="stylesheet" href="style.css"></head><body><div id="storage-status" role="status"></div>
<dialog id="cell-dialog" aria-labelledby="cell-title"><div class="cell-dialog-head"><span id="cell-cat" class="pill"></span><h2 id="cell-title"></h2><p id="cell-meta"></p><p id="cell-next"></p></div><div class="cell-actions"><button type="button" id="cell-done"></button><button type="button" id="cell-today">오늘 하기</button><button type="button" id="cell-date">날짜 변경</button><button type="button" id="cell-close">닫기</button></div></dialog>
<dialog id="date-editor" aria-labelledby="date-editor-title"><form id="date-form"><h2 id="date-editor-title">날짜 지정</h2><p id="date-task-title"></p><label>날짜<input type="date" id="date-start" required></label><label>종료일 <small>여러 날일 때</small><input type="date" id="date-end"></label><p id="date-error" role="alert"></p><div class="date-actions"><button type="button" id="date-today">오늘 하기</button><button type="button" id="date-clear">날짜 미정</button><button type="button" id="date-cancel">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>
<div class="shell">
<header class="top"><div class="logo"><span class="logo-mark">▦</span><b>SUBIN CELLS</b></div><nav class="topnav"><a href="./">목록 보기</a><span class="topnav-sep"></span><span class="clock" id="clock"></span><span class="sync" id="sync"></span></nav></header>
<aside class="side"><div class="side-title">내 뇌의 업무 현황<small>방마다 할 일이 살아 있어요</small></div><nav class="depts" id="depts"></nav><div class="side-foot"><span>CELLS v1</span></div></aside>
<main class="center"><div id="app"></div><div class="statline" id="stats"></div><div class="plan-wrap"><canvas id="plan" width="640" height="360"></canvas></div><div class="pipeline" id="pipeline"></div></main>
<aside class="chat"><div class="chat-head"><b>메인</b><span id="chat-pct"></span></div><div class="chat-feed" id="feed"></div><div class="chat-input">방을 클릭하면 상세가 열려요</div></aside>
</div>
<script src="app-base.js"></script><script src="app-cells.js"></script></body></html>
