<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>내 뇌의 업무 현황</title><meta name="description" content="픽셀 세포 오피스로 보는 내 일정"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23241d30'/%3E%3Crect x='2' y='2' width='12' height='12' fill='%23e8d54b'/%3E%3Crect x='5' y='6' width='2' height='2' fill='%23241d30'/%3E%3Crect x='9' y='6' width='2' height='2' fill='%23241d30'/%3E%3Crect x='5' y='10' width='6' height='1' fill='%23241d30'/%3E%3C/svg%3E"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="style.css"></head><body>
<div id="storage-status" role="status"></div>
<dialog id="cell-dialog" aria-labelledby="cell-title"><div class="cell-dialog-head"><span class="pill" id="cell-cat"></span><h2 id="cell-title"></h2><p id="cell-meta"></p><p id="cell-next"></p></div><div class="cell-actions"><button type="button" id="cell-done">✓ 완료</button><button type="button" id="cell-today">오늘 하기</button><button type="button" id="cell-date">날짜 변경</button><button type="button" id="cell-close">닫기</button></div></dialog>
<dialog id="date-editor" aria-labelledby="date-editor-title"><form id="date-form"><h2 id="date-editor-title">날짜 지정</h2><p id="date-task-title"></p><label>날짜<input type="date" id="date-start" required></label><label>종료일 <small>여러 날일 때</small><input type="date" id="date-end"></label><p id="date-error" role="alert"></p><div class="date-actions"><button type="button" id="date-today">오늘 하기</button><button type="button" id="date-clear">날짜 미정</button><button type="button" id="date-cancel">취소</button><button type="submit" class="primary">저장</button></div></form></dialog>
<div class="shell">
<aside class="side">
  <nav class="cells" id="cells"></nav>
  <p class="side-note">선택한 세포는 위를 더블 클릭하면 더 자세히 볼 수 있습니다.</p>
</aside>
<div class="mid">
  <header class="head">
    <h1>내 뇌의 업무 현황</h1>
    <p class="sub" id="session-sub"></p>
    <div class="hstats" id="hstats"></div>
  </header>
  <div class="toolbar">
    <span class="tb-label">재생 속도</span>
    <button class="tb spd" data-spd="1">1x</button><button class="tb spd" data-spd="2">2x</button><button class="tb spd" data-spd="4">4x</button>
    <button class="tb" id="tb-font">글씨체</button>
    <span class="tb-gap"></span>
    <button class="tb" id="tb-zout">−</button><button class="tb" id="tb-zin">+</button>
    <button class="tb gold" id="tb-fit">전체 맵</button>
    <button class="tb" id="tb-follow">자동 추적</button>
    <button class="tb" id="tb-big">큰 글씨</button>
  </div>
  <div class="stage" id="stage">
    <div class="map-tab">세포 지도</div>
    <div class="map-meta">IDLE<br><span>16 BIT ROOMS · PIXEL CHARACTERS</span></div>
    <div class="stage-scroll"><canvas id="plan"></canvas><div id="setup-slot"></div></div>
  </div>
  <footer class="cmd">
    <div class="cmd-top"><span class="cmd-title"><i></i>메인 명령</span><span class="cmd-pipe">PLAN → ASSIGN → TALK → VERIFY → ANSWER</span></div>
    <div class="cmd-chips"><span class="chip-y">자동 승인</span><span class="chip-d">직접 피드백</span><span class="cmd-note">실행 중 즉시 적용됨 · 대기 카드로 바로 통과됩니다</span><span class="sync" id="sync"></span><span class="clock" id="clock"></span></div>
    <div class="cmd-meta"><span class="mchip">모델 · subin-cells</span><span class="mchip" id="state-chip">상태 · 적용</span></div>
    <div class="cmd-input"><input id="cmd-in" autocomplete="off" placeholder="요청을 입력하거나 업무:/개발:/개인: 접두어로 세포를 고르세요"><button id="cmd-send" type="button">■ 전송</button></div>
  </footer>
</div>
<aside class="detail">
  <div id="detail-body"></div>
  <button class="fab" id="fab" title="새 요청">＋</button>
</aside>
</div>
<div id="app" hidden></div>
<script src="app-base.js"></script><script src="app-cells.js"></script>
</body></html>
